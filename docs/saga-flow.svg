<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db2777"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="520" rx="16" fill="#fafbfc"/>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Saga Flow — Place Order</text>
  <text x="410" y="52" text-anchor="middle" font-size="12" fill="#64748b">CQRS Command + Domain Event + Saga</text>

  <!-- Participants -->
  <!-- User -->
  <rect x="30" y="72" width="100" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">User</text>

  <!-- cart.vue -->
  <rect x="170" y="72" width="100" height="36" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#a16207">cart.vue</text>

  <!-- usePlaceOrder -->
  <rect x="310" y="72" width="120" height="36" rx="8" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#be185d">usePlaceOrder</text>

  <!-- $orderRepo -->
  <rect x="470" y="72" width="100" height="36" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="520" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">$orderRepo</text>

  <!-- useEvents -->
  <rect x="610" y="72" width="90" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="655" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">useEvents</text>

  <!-- useCart -->
  <rect x="730" y="72" width="70" height="36" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="765" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#a16207">useCart</text>

  <!-- Lifelines -->
  <line x1="80" y1="108" x2="80" y2="500" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="220" y1="108" x2="220" y2="500" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="370" y1="108" x2="370" y2="500" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="520" y1="108" x2="520" y2="500" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="655" y1="108" x2="655" y2="500" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="765" y1="108" x2="765" y2="500" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Step 1: User → cart.vue -->
  <line x1="80" y1="148" x2="220" y2="148" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="96" y="132" width="108" height="20" rx="4" fill="white" stroke="none"/>
  <text x="150" y="146" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="500">clicks "Place Order"</text>

  <!-- Step 2: cart.vue → usePlaceOrder -->
  <line x1="220" y1="190" x2="370" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="240" y="174" width="110" height="20" rx="4" fill="white" stroke="none"/>
  <text x="295" y="188" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="500">execute(cartItems)</text>

  <!-- Step 3: usePlaceOrder → $orderRepo -->
  <line x1="370" y1="232" x2="520" y2="232" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="392" y="216" width="110" height="20" rx="4" fill="white" stroke="none"/>
  <text x="445" y="230" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="500">place(orderItems)</text>

  <!-- Step 4: $orderRepo → usePlaceOrder (response) -->
  <line x1="520" y1="272" x2="370" y2="272" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#arr-gray)"/>
  <rect x="410" y="256" width="60" height="20" rx="4" fill="white" stroke="none"/>
  <text x="445" y="270" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="500">order</text>

  <!-- Step 5: usePlaceOrder → useEvents (emit) -->
  <line x1="370" y1="314" x2="655" y2="314" stroke="#db2777" stroke-width="2" marker-end="url(#arr-pink)"/>
  <rect x="428" y="296" width="180" height="22" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
  <text x="518" y="312" text-anchor="middle" font-size="10" fill="#db2777" font-weight="600">emit(OrderPlaced, order)</text>

  <!-- Step 6: useEvents → useCart (saga) -->
  <line x1="655" y1="356" x2="765" y2="356" stroke="#db2777" stroke-width="2" marker-end="url(#arr-pink)"/>
  <rect x="668" y="340" width="78" height="20" rx="4" fill="#fdf2f8" stroke="none"/>
  <text x="710" y="354" text-anchor="middle" font-size="10" fill="#db2777" font-weight="500">OrderPlaced</text>

  <!-- Step 7: useCart clears itself -->
  <rect x="744" y="378" width="42" height="24" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="765" y="394" text-anchor="middle" font-size="10" fill="#a16207" font-weight="600">clear()</text>

  <!-- Step 8: usePlaceOrder → cart.vue (return) -->
  <line x1="370" y1="430" x2="220" y2="430" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#arr-gray)"/>
  <rect x="252" y="414" width="60" height="20" rx="4" fill="white" stroke="none"/>
  <text x="295" y="428" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="500">order</text>

  <!-- Step 9: cart.vue navigates -->
  <rect x="176" y="452" width="88" height="24" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="220" y="468" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="500">navigateTo()</text>

  <!-- Saga annotation -->
  <rect x="618" y="380" width="80" height="16" rx="4" fill="#db2777" opacity="0.1" stroke="none"/>
  <text x="658" y="392" text-anchor="middle" font-size="9" fill="#db2777" font-weight="600">SAGA</text>
</svg>
