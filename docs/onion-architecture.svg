<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="480" rx="16" fill="#fafbfc"/>

  <!-- Title -->
  <text x="350" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Onion Architecture — inside each bounded context</text>

  <!-- Outer ring: app/ -->
  <rect x="60" y="56" width="580" height="340" rx="20" fill="#fefce8" stroke="#fde68a" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#a16207">app/</text>
  <text x="350" y="104" text-anchor="middle" font-size="12" fill="#92400e">components · composables · pages</text>

  <!-- Middle ring: infrastructure/ -->
  <rect x="120" y="120" width="460" height="220" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">infrastructure/</text>
  <text x="350" y="168" text-anchor="middle" font-size="12" fill="#166534">adapters · fakes · mappers</text>

  <!-- Core: domain/ -->
  <rect x="190" y="188" width="320" height="120" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="350" y="224" text-anchor="middle" font-size="16" font-weight="800" fill="#1e40af">domain/</text>
  <text x="350" y="248" text-anchor="middle" font-size="12" fill="#1e3a5f">model · port · events</text>
  <text x="350" y="268" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">pure TypeScript — no framework imports</text>
  <text x="350" y="288" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">no dependencies on outer rings</text>

  <!-- Arrows: app → infra -->
  <line x1="160" y1="108" x2="160" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="108" x2="540" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows: infra → domain -->
  <line x1="230" y1="172" x2="230" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="172" x2="470" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: app → domain (skip infra) -->
  <path d="M 100 250 Q 80 248 100 248 L 190 248" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- Key rule -->
  <rect x="100" y="412" width="500" height="52" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="350" y="434" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">Key rule: dependencies only point inward, never outward</text>
  <text x="350" y="452" text-anchor="middle" font-size="11" fill="#9a3412">Delete app/ and infrastructure/ — domain/ still compiles</text>
</svg>
