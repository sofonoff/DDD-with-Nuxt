<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db2777"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="#fafbfc"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Context Map</text>

  <!-- Shared -->
  <rect x="200" y="56" width="500" height="72" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">shared</text>
  <text x="450" y="108" text-anchor="middle" font-size="12" fill="#64748b">money.ts · useEvents · UiButton · UiPriceTag</text>

  <!-- Catalog -->
  <rect x="60" y="200" width="220" height="110" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">catalog</text>
  <text x="170" y="256" text-anchor="middle" font-size="12" fill="#64748b">Product</text>
  <text x="170" y="276" text-anchor="middle" font-size="12" fill="#64748b">useProducts</text>
  <text x="170" y="296" text-anchor="middle" font-size="12" fill="#64748b">server/api/products</text>

  <!-- Cart -->
  <rect x="340" y="200" width="220" height="110" rx="14" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#a16207">cart</text>
  <text x="450" y="256" text-anchor="middle" font-size="12" fill="#64748b">CartItem</text>
  <text x="450" y="276" text-anchor="middle" font-size="12" fill="#64748b">useCart</text>
  <text x="450" y="296" text-anchor="middle" font-size="12" fill="#64748b">localStorage adapter</text>

  <!-- Orders -->
  <rect x="620" y="200" width="220" height="110" rx="14" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="730" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#be185d">orders</text>
  <text x="730" y="256" text-anchor="middle" font-size="12" fill="#64748b">Order</text>
  <text x="730" y="276" text-anchor="middle" font-size="12" fill="#64748b">useOrders / usePlaceOrder</text>
  <text x="730" y="296" text-anchor="middle" font-size="12" fill="#64748b">server/api/orders</text>

  <!-- Arrows to shared (dashed) -->
  <line x1="170" y1="200" x2="350" y2="128" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="450" y1="200" x2="450" y2="128" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="730" y1="200" x2="550" y2="128" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- catalog → cart: direct call -->
  <line x1="280" y1="270" x2="340" y2="270" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- orders → cart: event -->
  <line x1="620" y1="260" x2="560" y2="260" stroke="#db2777" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#arrow-pink)"/>

  <!-- cart → catalog: type import -->
  <path d="M 380 310 Q 280 360 200 310" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- orders → cart: type import -->
  <path d="M 660 310 Q 560 360 520 310" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <rect x="256" y="382" width="388" height="120" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Legend -->
  <text x="270" y="406" font-size="13" font-weight="600" fill="#0f172a">Legend</text>

  <line x1="270" y1="428" x2="308" y2="428" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="316" y="432" font-size="11" fill="#64748b">Type import via index.ts</text>

  <line x1="270" y1="452" x2="308" y2="452" stroke="#2563eb" stroke-width="2"/>
  <text x="316" y="456" font-size="11" fill="#64748b">Direct composable call (UI-initiated)</text>

  <line x1="270" y1="476" x2="308" y2="476" stroke="#db2777" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="316" y="480" font-size="11" fill="#64748b">Event-driven (Saga: OrderPlaced → cart.clear)</text>
</svg>
